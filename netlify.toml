[build]
  command = "npm run build"
  publish = "dist"

# The site is still statically generated. This one function backs the heavy bag
# leaderboard, which is the only thing on the site that needs to remember
# anything between visitors. It declares its own route (/api/leaderboard) in
# netlify/functions/leaderboard.mjs.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# Long-cache the fingerprinted bundles Astro emits; everything else stays
# revalidated so content edits go live on the next request.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --- Legacy WordPress URLs -> new structure -------------------------------
# The page slugs themselves are preserved 1:1, so these only clean up the
# WordPress-isms that were also indexed.
[[redirects]]
  from = "/faq/"
  to = "/frequently-asked-questions/"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/contact-us/"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/about-us/"
  status = 301

[[redirects]]
  from = "/feed/"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/comments/feed/"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
